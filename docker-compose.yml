services:
  smart-attendance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-attendance-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - attendance-data:/app/data

volumes:
  attendance-data:
    driver: local
